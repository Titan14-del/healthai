<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - HealthAI</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 18px/1.5 system-ui, sans-serif; background: #fff; color: #333; display: flex; justify-content: center; padding: 80px 20px; }
  .card { max-width: 400px; width: 100%; padding: 32px; border: 1px solid #e5e4e7; border-radius: 8px; text-align: center; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: #6b6375; margin-bottom: 20px; }
  input { width: 100%; padding: 10px 14px; border: 1px solid #e5e4e7; border-radius: 6px; font: 16px system-ui, sans-serif; margin-bottom: 12px; }
  input:focus { outline: none; border-color: #aa3bff; }
  button { width: 100%; padding: 10px; border: none; border-radius: 6px; font: 16px system-ui, sans-serif; background: #aa3bff; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  .error { color: #dc2626; font-size: 14px; margin-bottom: 12px; }
  .success { color: #16a34a; font-size: 14px; margin-bottom: 12px; }
  .back { display: inline-block; margin-top: 16px; color: #aa3bff; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const app = document.getElementById('app');

function render(html) { app.innerHTML = html; }

if (!token) {
  render(`<h1>Invalid link</h1><p>This reset link is missing a token.</p><a href="/forgot-password" class="back">Request a new link</a>`);
} else {
  render(`
    <h1>Reset password</h1>
    <p>Enter your new password.</p>
    <div id="error" class="error"></div>
    <div id="success" class="success"></div>
    <form id="form">
      <input type="password" name="password" placeholder="New password (8+ chars, uppercase, number, special)" required minlength="8">
      <input type="password" name="confirm" placeholder="Confirm new password" required minlength="8">
      <button type="submit" id="btn">Reset password</button>
    </form>
    <a href="/" class="back">Back to home</a>
  `);

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = e.target.password.value;
    const confirm = e.target.confirm.value;
    const errEl = document.getElementById('error');
    const sucEl = document.getElementById('success');
    errEl.textContent = '';
    sucEl.textContent = '';

    if (pw !== confirm) { errEl.textContent = 'Passwords do not match'; return; }

    document.getElementById('btn').disabled = true;
    try {
      const res = await fetch('/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: pw }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Reset failed');
      sucEl.textContent = 'Password reset successfully!';
      document.getElementById('form').innerHTML = '<a href="/" class="back">Go to home</a>';
    } catch (err) {
      errEl.textContent = err.message;
    } finally {
      document.getElementById('btn').disabled = false;
    }
  });
}
</script>
</body>
</html>
